name: Fail
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=1" >> $GITHUB_OUTPUT
  deploy:
    runs-on: ubuntu-latest
    needs: [ build, nope ]
    steps:
      - run: echo ${{ needs.build.outputs.sha }}
permissions: read-all
