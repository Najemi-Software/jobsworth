# expect: none
name: Sparse checkouts that cover the action, or cannot be evaluated
on: push
jobs:
  cone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
      - uses: ./.github/actions/greet
        with:
          name: world
  dynamic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ vars.SPARSE_PATHS }}
      - uses: ./.github/actions/greet
        with:
          name: world
  globs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .git*
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/greet
        with:
          name: world
