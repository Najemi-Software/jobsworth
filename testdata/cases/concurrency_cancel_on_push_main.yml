# config: rules: { concurrency-cancel-on-push-main: note }
# expect: note concurrency-cancel-on-push-main
name: concurrency-cancel-on-push-main flagged
on:
  push:
    branches: [main]
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo deploy
