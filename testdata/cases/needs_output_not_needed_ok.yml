# expect: none
name: Transitively needed job outputs are accepted
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: x
    steps:
      - run: echo ok
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo ok
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo ${{ needs.build.outputs.version }}
