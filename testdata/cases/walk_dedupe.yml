# expect: warning input-unused "'unused'"
# expect: error input-undeclared "'typo'"
name: A callee referenced twice is validated once
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dirty
        with:
          used: 1
      - uses: ./.github/actions/dirty
        with:
          used: 2
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nested
