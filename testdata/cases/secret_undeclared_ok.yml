# expect: none
name: Declared secrets, GITHUB_TOKEN, and a workflow with another trigger
on:
  workflow_call:
    secrets:
      token:
        required: true
  push:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: x=${{ secrets.token }} ${{ secrets.GITHUB_TOKEN }} ${{ secrets.REPO_LEVEL }}
