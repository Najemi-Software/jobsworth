# expect: none
name: Two conditional checkouts; the consumer runs when the full one did
on: push
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - if: github.ref != 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs
      - if: github.ref == 'refs/heads/main'
        uses: acme/wrappers/checkout-cached@v1
      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/greet
        with:
          name: world
