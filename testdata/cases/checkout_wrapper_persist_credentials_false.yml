# config: rules: { checkout-persist-credentials: note }
# config: security: { strict: true }
# expect: note artifact-whole-workspace
name: persist-credentials false through a wrapper is honoured
on: push
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: acme/wrappers/checkout-cached@v1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          path: .
