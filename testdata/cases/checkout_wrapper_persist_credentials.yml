# config: rules: { checkout-persist-credentials: note }
# config: security: { strict: true }
# expect: note checkout-persist-credentials
# expect: note artifact-whole-workspace
name: persist-credentials through a wrapper is seen in strict mode
on: push
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: acme/wrappers/checkout-cached@v1
      - uses: actions/upload-artifact@v4
        with:
          path: .
