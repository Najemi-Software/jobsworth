# config: rules: { checkout-ref-unresolvable: note }
# expect: note checkout-ref-unresolvable "expression for ref:"
name: Checkout ref from an expression, with the rule enabled
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: make test
