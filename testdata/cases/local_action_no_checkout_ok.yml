# expect: none
name: Root checkouts, including a composite wrapper and a dynamic path adopted as root
on: push
jobs:
  plain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/greet
        with:
          name: world
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: acme/wrappers/checkout-with-cache@v1
      - uses: ./.github/actions/greet
        with:
          name: world
  dynamic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ github.workspace }}/sub
      - uses: ./.github/actions/greet
        with:
          name: world
