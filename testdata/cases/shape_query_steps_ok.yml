# expect: none
# shape: --at build 'steps.cfg.outputs.cfg' => String ⊂ JSON → Object{meta: Object{id: Number}, name: String, tags: Array[String]}
# shape: --at build 'fromJSON(steps.cfg.outputs.cfg).tags' => Array[String]
# shape: --at build 'fromJSON(steps.cfg.outputs.cfg).meta.id' => Number
# shape: --at build/#2 'steps.cfg.outputs.cfg' => String ⊂ JSON → Object{meta: Object{id: Number}, name: String, tags: Array[String]}
# shape: --at build 'steps.cfg.outcome' => String ∈ {success, failure, cancelled, skipped}
# shape: --at build 'fromJSON(steps.cfg.outputs.cfg).nope' => ✗ field "nope" not in object
