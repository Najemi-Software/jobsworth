name: Shape queries over a step's JSON output
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: cfg
        run: |
          echo 'cfg={"name":"x","tags":["a","b"],"meta":{"id":1}}' >> "$GITHUB_OUTPUT"
      - run: echo ${{ fromJSON(steps.cfg.outputs.cfg).meta.id }}
