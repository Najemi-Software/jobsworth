# expect: none
name: Job outputs consumed by needs or lifted into workflow outputs
on:
  workflow_call:
    outputs:
      sha:
        value: ${{ jobs.build.outputs.sha }}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: x
      sha: y
    steps:
      - run: echo ok
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo ${{ needs.build.outputs.version }}
