# expect: error needs-cycle "a -> b -> c -> a"
name: Three jobs form a needs cycle, reported once
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    needs: c
    steps:
      - run: echo ok
  b:
    runs-on: ubuntu-latest
    needs: a
    steps:
      - run: echo ok
  c:
    runs-on: ubuntu-latest
    needs: b
    steps:
      - run: echo ok
  d:
    runs-on: ubuntu-latest
    needs: a
    steps:
      - run: echo ok