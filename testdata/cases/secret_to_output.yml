# expect: warning secret-to-output "masks it"
name: Job output set to a secret
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ secrets.TOKEN }}
    steps:
      - run: echo ok
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo ${{ needs.build.outputs.token }}
