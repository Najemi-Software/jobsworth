# expect: none
name: Diamond dependency is not a cycle
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
  b:
    runs-on: ubuntu-latest
    needs: a
    steps:
      - run: echo ok
  c:
    runs-on: ubuntu-latest
    needs: a
    steps:
      - run: echo ok
  d:
    runs-on: ubuntu-latest
    needs: [ b, c ]
    steps:
      - run: echo ok