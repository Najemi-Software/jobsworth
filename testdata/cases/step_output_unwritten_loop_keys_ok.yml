# expect: none
# shape: --at build 'steps.gen.outputs.run-b' => String ∈ {1}
name: Keys built from loop variables, brace ranges, read and static assignments resolve
on: push
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: gen
        run: |
          for k in a b c; do echo "run-$k=1" >> "$GITHUB_OUTPUT"; done
          for i in {1..3}; do echo "n$i=x" >> "$GITHUB_OUTPUT"; done
          K=version
          echo "$K=2" >> "$GITHUB_OUTPUT"
          read -r NAME REST <<< "mode value"
          echo "$NAME=$REST" >> "$GITHUB_OUTPUT"
          emit() { echo "$1=ok" >> "$GITHUB_OUTPUT"; }
          emit alpha
      - run: echo ${{ steps.gen.outputs.run-a }} ${{ steps.gen.outputs.run-b }} ${{ steps.gen.outputs.run-c }} ${{ steps.gen.outputs.n1 }} ${{ steps.gen.outputs.n2 }} ${{ steps.gen.outputs.n3 }} ${{ steps.gen.outputs.version }} ${{ steps.gen.outputs.mode }} ${{ steps.gen.outputs.alpha }}
