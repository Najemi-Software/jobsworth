# expect: none
name: Example
on: push
permissions: read-all
jobs:
  a:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.s.outputs.v }}
    steps:
      - id: s
        if: github.ref == 'refs/heads/main'
        run: echo "v=1" >> "$GITHUB_OUTPUT"
  b:
    runs-on: ubuntu-latest
    needs: a
    if: needs.a.result == 'success'
    steps:
      - run: echo ${{ needs.a.outputs.v }}
