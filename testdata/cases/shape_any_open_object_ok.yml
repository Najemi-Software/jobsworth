# expect: none
# shape: 'github.event.head_commit.message_ts' => Any (opaque: .message_ts: 'message_ts' is not among the known fields of an open object → Any)
name: A field missing from an open object is Any with the reason, not a mismatch
on: push
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{ github.event.head_commit.message_ts }}
