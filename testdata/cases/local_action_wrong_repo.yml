# self: acme/app
# expect: warning local-action-wrong-repo "loaded from acme/shared"
name: Root checkout of another repository that owns the action path
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: acme/shared
      - uses: ./.github/actions/notify
        with:
          env: prod
