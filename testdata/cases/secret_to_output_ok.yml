# expect: none
name: Secret used in a step, and an output that merely mentions one in a format call
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has: ${{ secrets.TOKEN != '' }}
    steps:
      - run: x=${{ secrets.TOKEN }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo ${{ needs.build.outputs.has }}
