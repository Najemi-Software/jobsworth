name: Release
on: [push, pull_request]
env:
  REGION: eu
jobs:
  set-vars:
    runs-on: ubuntu-latest
    outputs:
      canary: ${{ steps.build-clusters-matrix.outputs.canary }}
    steps:
      - uses: actions/checkout@v4
      - id: build-clusters-matrix
        env:
          DATA_FILE: .github/workflows/data/clusters.yml
        run: |
          CANARY_MATRIX=$(yq e '.canary' -o=json -M "$DATA_FILE" | jq -c)
          echo "canary=$CANARY_MATRIX" >> $GITHUB_OUTPUT
          echo "VERSION=1.2.3" >> $GITHUB_ENV
      - run: echo ${{ env.VERSION }} ${{ env.REGION }}
  deploy:
    runs-on: ubuntu-latest
    needs: set-vars
    strategy:
      matrix:
        os: [ubuntu, windows]
        include: ${{ fromJSON(needs.set-vars.outputs.canary) }}
    steps:
      - run: echo ${{ fromJSON(needs.set-vars.outputs.canary)[0].cluster }} ${{ matrix.os }} ${{ github.event_name }}
      - uses: ./.github/actions/meta
        id: meta
      - run: echo ${{ steps.meta.outputs.sha }} ${{ fromJSON(needs.set-vars.outputs.canary)[0].region }}
  call:
    uses: ./.github/workflows/reuse.yml
    with:
      cfg: '{"replicas": {"min": 1, "max": 3}}'
permissions: read-all
